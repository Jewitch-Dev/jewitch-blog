name: Import Mastodon Notes

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-mastodon-notes
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Import public Mastodon Notes
        run: node scripts/fetch-mastodon.js

      - name: Commit imported Notes when changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- content/notes/imported && \
             [ -z "$(git ls-files --others --exclude-standard content/notes/imported)" ]; then
            echo "No Mastodon Note changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/notes/imported
          git commit -m "Sync Mastodon Notes"
          git push origin HEAD:main
